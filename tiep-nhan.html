<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tiếp nhận & Quét CCCD</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body { background-color: #f4f6f9; font-family: system-ui, -apple-system, sans-serif; padding: 15px 5px; }
    .card-main { max-width: 650px; margin: 0 auto; border-radius: 14px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #fff; }
    .card-header-custom { background: linear-gradient(135deg, #0d6efd, #0b5ed7); color: white; padding: 18px; border-radius: 14px 14px 0 0; text-align: center; }
    .scanner-box { background: #fff3cd; border: 2px dashed #ffc107; border-radius: 8px; padding: 10px; margin-bottom: 16px; }
    .section-label { font-size: 13px; font-weight: 700; color: #0d6efd; text-transform: uppercase; margin: 15px 0 8px 0; border-bottom: 1px solid #dee2e6; padding-bottom: 4px; }
    #cameraView { display: none; width: 100%; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
    .char-count { font-size: 12px; font-weight: 600; color: #6c757d; }
    .char-count.valid { color: #198754; }
  </style>
</head>
<body>

<div class="container">
  <div class="card card-main">
    <div class="card-header-custom position-relative">
      <a href="index.html" class="btn btn-sm btn-light position-absolute start-0 top-50 translate-middle-y ms-3">
        <i class="fa-solid fa-arrow-left"></i> Về Menu
      </a>
      <h5 class="mb-0 fw-bold"><i class="fa-solid fa-address-card me-2"></i>TIẾP NHẬN & QUÉT CCCD</h5>
    </div>

    <div class="card-body p-4">
      <!-- 1. Vùng nhận dữ liệu máy quét cầm tay -->
      <div class="scanner-box">
        <label class="form-label fw-bold text-dark mb-1">
          <i class="fa-solid fa-barcode me-1"></i>Máy quét mã QR cầm tay:
        </label>
        <textarea id="generalAddScanner" class="form-control" rows="2" 
                  autocomplete="off" autocapitalize="off" spellcheck="false" 
                  placeholder="Bấm vào đây rồi quét thẻ CCCD..." 
                  onkeydown="handleScannerKey(event)" 
                  oninput="handleScannerInput(this)"></textarea>
      </div>

      <!-- 2. Vùng quét bằng Camera điện thoại -->
      <button type="button" class="btn btn-outline-primary w-100 py-2 mb-3 fw-bold" onclick="toggleCamera()">
        <i class="fa-solid fa-camera me-2"></i><span id="btnCameraText">Bật Camera Quét Mã QR</span>
      </button>
      <div id="cameraView"></div>

      <form id="formHoSo" onsubmit="save(event)">
        <div class="section-label">Thông tin cá nhân</div>

        <div class="row g-2">
          <div class="col-8">
            <div class="d-flex justify-content-between">
              <label class="form-label small fw-bold">Số CCCD (bắt buộc 12 số) <span class="text-danger">*</span></label>
              <span id="cccdCount" class="char-count">0/12</span>
            </div>
            <input type="text" class="form-control" id="idNumber" required 
                   maxlength="12" placeholder="Nhập đúng 12 chữ số" 
                   oninput="kiemTraCCCD(this)">
          </div>
          <div class="col-4">
            <label class="form-label small fw-bold">Giới tính <span class="text-danger">*</span></label>
            <select class="form-select" id="gender" required>
              <option value="Nam">Nam</option>
              <option value="Nữ">Nữ</option>
            </select>
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-8">
            <label class="form-label small fw-bold">Họ và tên <span class="text-danger">*</span></label>
            <input type="text" class="form-control text-uppercase" id="fullName" required 
                   placeholder="NGUYỄN VĂN A" oninput="this.value = this.value.toUpperCase()">
          </div>
          <div class="col-4">
            <label class="form-label small fw-bold">Số CMND cũ</label>
            <input type="text" class="form-control" id="oldId" maxlength="12" placeholder="9 hoặc 12 số">
          </div>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-4">
            <label class="form-label small fw-bold">Ngày sinh (dd/mm/yyyy) <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="dateOfBirth" required 
                   placeholder="dd/mm/yyyy" maxlength="10" oninput="dinhDangNgay(this)" onblur="tinhTuoi()">
          </div>
          <div class="col-3">
            <label class="form-label small fw-bold">Tuổi</label>
            <input type="text" class="form-control bg-light" id="age" readonly>
          </div>
          <div class="col-5">
            <label class="form-label small fw-bold">Nhóm tuổi</label>
            <input type="text" class="form-control bg-light" id="ageGroup" readonly>
          </div>
        </div>

        <div class="mt-2">
          <label class="form-label small fw-bold">Địa chỉ thường trú</label>
          <textarea class="form-control" id="address" rows="2" placeholder="Số nhà, khu phố, xã/phường..."></textarea>
        </div>

        <div class="row g-2 mt-2">
          <div class="col-6">
            <label class="form-label small fw-bold">Số điện thoại</label>
            <input type="tel" class="form-control" id="phone" maxlength="10" 
                   placeholder="10 số (bắt đầu 0...)" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Ngày cấp CCCD</label>
            <input type="text" class="form-control" id="issueDate" maxlength="10" 
                   placeholder="dd/mm/yyyy" oninput="dinhDangNgay(this)">
          </div>
        </div>

        <div class="section-label">Đơn vị tiếp nhận</div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Đơn vị / Trường học <span class="text-danger">*</span></label>
          <select class="form-select" id="department" required onchange="thayDoiDonVi(this)">
            <option value="">-- Đang đồng bộ từ Google Sheets... --</option>
          </select>
        </div>

        <div class="mb-3 d-none" id="customDeptBox">
          <label class="form-label small fw-bold text-primary">Nhập tên đơn vị mới:</label>
          <input type="text" class="form-control" id="customDepartment" placeholder="Nhập tên trường / cơ quan...">
        </div>

        <button type="submit" id="btnSubmit" class="btn btn-primary w-100 py-3 fw-bold mt-3">
          <i class="fa-solid fa-cloud-arrow-up me-2"></i>LƯU THÔNG TIN
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzU4SBwxOb43OX3ewJKgLpg1iOuxFlWr6ZOiuveJUvW_Qt8OyhnVCUywM6ViYIxCgI8/exec";
  let html5Scanner;
  let isScanning = false;

  window.onload = function() {
    document.getElementById('generalAddScanner').focus();
  };

  // HÀM NHẬN DANH MỤC TỪ GOOGLE SHEETS QUA CHUẨN JSONP
  function loadDanhMuc(danhMuc) {
    let sel = document.getElementById('department');
    sel.innerHTML = '<option value="">-- Chọn đơn vị --</option>';
    
    if (Array.isArray(danhMuc) && danhMuc.length > 0) {
      danhMuc.forEach(item => {
        let opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        sel.appendChild(opt);
      });
    }
    
    // Thêm tùy chọn Khác
    let optKhac = document.createElement('option');
    optKhac.value = 'KHAC';
    optKhac.textContent = '-- Khác (Tự nhập tên đơn vị mới) --';
    sel.appendChild(optKhac);
  }

  function kiemTraCCCD(elem) {
    elem.value = elem.value.replace(/[^0-9]/g, '');
    let len = elem.value.length;
    let countElem = document.getElementById('cccdCount');
    countElem.textContent = len + '/12';
    countElem.className = (len === 12) ? 'char-count valid' : 'char-count';
  }

  function dinhDangNgay(elem) {
    let v = elem.value.replace(/[^0-9]/g, '');
    if (v.length > 2 && v.length <= 4) {
      elem.value = v.slice(0, 2) + '/' + v.slice(2);
    } else if (v.length > 4) {
      elem.value = v.slice(0, 2) + '/' + v.slice(2, 4) + '/' + v.slice(4, 8);
    }
  }

  function thayDoiDonVi(sel) {
    let box = document.getElementById('customDeptBox');
    let customInput = document.getElementById('customDepartment');
    if (sel.value === 'KHAC') {
      box.classList.remove('d-none');
      customInput.required = true;
      customInput.focus();
    } else {
      box.classList.add('d-none');
      customInput.required = false;
      customInput.value = '';
    }
  }

  function handleScannerKey(e) {
    if (e.key === 'Enter' || e.keyCode === 13) {
      e.preventDefault();
      parseQR(e.target.value);
      e.target.value = '';
    }
  }

  function handleScannerInput(elem) {
    let val = elem.value.trim();
    if ((val.match(/\|/g) || []).length >= 5) {
      parseQR(val);
      elem.value = '';
    }
  }

  function toggleCamera() {
    let box = document.getElementById('cameraView');
    let btnText = document.getElementById('btnCameraText');
    if (isScanning) {
      html5Scanner.stop().then(() => {
        box.style.display = 'none';
        isScanning = false;
        btnText.textContent = 'Bật Camera Quét Mã QR';
      });
    } else {
      box.style.display = 'block';
      html5Scanner = new Html5Qrcode("cameraView");
      html5Scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },
        (decodedText) => {
          parseQR(decodedText);
          toggleCamera();
        }
      );
      isScanning = true;
      btnText.textContent = 'Tắt Camera';
    }
  }

  function parseQR(raw) {
    if (!raw) return;
    let parts = raw.split('|');
    if (parts.length < 5) {
      Swal.fire('Lỗi định dạng', 'Mã QR không đúng chuẩn Căn cước công dân', 'warning');
      return;
    }

    let cccdInput = document.getElementById('idNumber');
    cccdInput.value = parts[0] || '';
    kiemTraCCCD(cccdInput);

    document.getElementById('oldId').value = parts[1] || '';
    document.getElementById('fullName').value = (parts[2] || '').toUpperCase();
    
    let dob = parts[3] || '';
    if (dob.length === 8) {
      document.getElementById('dateOfBirth').value = dob.substring(0,2) + '/' + dob.substring(2,4) + '/' + dob.substring(4,8);
    }
    
    document.getElementById('gender').value = (parts[4] && parts[4].toLowerCase() === 'nam') ? 'Nam' : 'Nữ';
    document.getElementById('address').value = parts[5] || '';

    let issue = parts[6] || '';
    if (issue.length === 8) {
      document.getElementById('issueDate').value = issue.substring(0,2) + '/' + issue.substring(2,4) + '/' + issue.substring(4,8);
    }

    tinhTuoi();
    Swal.fire({ icon: 'success', title: 'Đã quét CCCD thành công!', timer: 1200, showConfirmButton: false });
  }

  function tinhTuoi() {
    let dob = document.getElementById('dateOfBirth').value.trim();
    let parts = dob.split('/');
    if (parts.length === 3) {
      let year = parseInt(parts[2], 10);
      let currentYear = new Date().getFullYear();
      let age = currentYear - year;
      if (age >= 0 && age <= 130) {
        document.getElementById('age').value = age;
        if (age < 18) {
          document.getElementById('ageGroup').value = 'Dưới 18 tuổi';
        } else if (age < 60) {
          document.getElementById('ageGroup').value = '18 đến dưới 60 tuổi';
        } else {
          document.getElementById('ageGroup').value = 'Từ 60 tuổi trở lên';
        }
      }
    }
  }

  function save(e) {
    e.preventDefault();

    let cccdVal = document.getElementById('idNumber').value.trim();
    if (cccdVal.length !== 12) {
      Swal.fire('Lỗi định dạng', 'Số Căn cước công dân bắt buộc phải gồm đúng 12 chữ số!', 'error');
      document.getElementById('idNumber').focus();
      return;
    }

    let phoneVal = document.getElementById('phone').value.trim();
    if (phoneVal && (phoneVal.length !== 10 || !phoneVal.startsWith('0'))) {
      Swal.fire('Lỗi số điện thoại', 'Số điện thoại phải gồm đúng 10 số và bắt đầu bằng số 0!', 'warning');
      document.getElementById('phone').focus();
      return;
    }

    let donViVal = document.getElementById('department').value;
    if (donViVal === 'KHAC') {
      donViVal = document.getElementById('customDepartment').value.trim();
      if (!donViVal) {
        Swal.fire('Thiếu thông tin', 'Vui lòng nhập tên đơn vị mới!', 'warning');
        document.getElementById('customDepartment').focus();
        return;
      }
    }

    let btn = document.getElementById('btnSubmit');
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-2"></i>Đang lưu vào Sheets...';

    let data = {
      cccd: cccdVal,
      oldId: document.getElementById('oldId').value,
      hoTen: document.getElementById('fullName').value.trim(),
      gioiTinh: document.getElementById('gender').value,
      ngaySinh: document.getElementById('dateOfBirth').value,
      tuoi: document.getElementById('age').value,
      nhomTuoi: document.getElementById('ageGroup').value,
      diaChi: document.getElementById('address').value,
      soDienThoai: phoneVal,
      donVi: donViVal
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    })
    .then(res => res.json())
    .then(res => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-2"></i>LƯU THÔNG TIN';
      if (res.status === 'success') {
        Swal.fire('Thành công', res.message, 'success');
        document.getElementById('formHoSo').reset();
        document.getElementById('cccdCount').textContent = '0/12';
        document.getElementById('cccdCount').className = 'char-count';
        document.getElementById('customDeptBox').classList.add('d-none');
        document.getElementById('generalAddScanner').focus();
      } else {
        Swal.fire('Lỗi', res.message, 'error');
      }
    })
    .catch(err => {
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-up me-2"></i>LƯU THÔNG TIN';
      Swal.fire('Lỗi kết nối', 'Không thể gửi dữ liệu: ' + err, 'error');
    });
  }
</script>

<!-- KẾT NỐI TỰ ĐỘNG ĐỌC GOOGLE SHEETS QUA JSONP KHÔNG BỊ CHẶN CORS -->
<script src="https://script.google.com/macros/s/AKfycbzU4SBwxOb43OX3ewJKgLpg1iOuxFlWr6ZOiuveJUvW_Qt8OyhnVCUywM6W9tqKj8tL/exec?callback=loadDanhMuc"></script>
</body>
</html>
